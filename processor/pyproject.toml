[project]
name = "document-cropper-processor"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115,<1",
    "numpy>=2.2.6",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "rembg[cpu]>=2.0.60",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.fastapi]
entrypoint = "main:app"

[dependency-groups]
dev = [
    "httpx2>=2.0.0",
    "pytest>=9.1.1",
]
