[project]
name = "document-cropper-core-extensions"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115,<1",
    "numpy>=2.2.6",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "rembg[cpu]>=2.0.60",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.fastapi]
entrypoint = "src.core.app:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
